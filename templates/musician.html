<style>
    .fs {
        max-width: 100%;
        max-height: 100%;
        bottom: 0;
        left: 0;
        margin: auto;
        overflow: auto;
        position: fixed;
        right: 0;
        top: 0;
        -o-object-fit: contain;
        object-fit: contain;
        -webkit-tap-highlight-color: transparent;
    }

    /* Image-type (group) bar: top of the screen, centred, 50% translucent.
       Normal window only — the <img> itself goes fullscreen, so nothing else
       is visible in fullscreen mode. */
    .mg-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 12px;
        pointer-events: none;
        z-index: 5;
    }
    .mg-btn {
        pointer-events: auto;
        opacity: 0.5;
        min-height: 56px;
        padding: 0 28px;
        border: none;
        border-radius: 12px;
        background: #2c3e50;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
    }
    .mg-btn:focus { outline: none; }
    .mg-btn.mg-sel { background: #1a6db5; }
    .mg-btn.mg-shown { box-shadow: inset 0 0 0 2px #fff; }
    .mg-btn.mg-empty { color: rgba(255,255,255,0.55); }
</style>
<div ng-controller="Musician" class="container">

    <div>
        <img id="img0"
             class="fs"
             ng-click="toggleFullscreen()"
             onerror="angular.element(this).scope().onImageError()"
             ng-src="{{imgName}}"/>
    </div>

    <div class="mg-bar" ng-if="!fullScreen && notes.groups.length">
        <button class="mg-btn"
                ng-repeat="g in notes.groups track by g.id"
                ng-class="{'mg-sel': g.id === selectedGroupId,
                           'mg-shown': shownGroup && g.id === shownGroup.id && g.id !== selectedGroupId,
                           'mg-empty': !g.image}"
                ng-click="selectGroup(g)">{{ g.name }}</button>
    </div>

</div>

<script src="/js/musician.min.js?v=10030" type="text/javascript"></script>
