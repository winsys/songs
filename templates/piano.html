<style>
    /* ============================================================
       PIANIST MODE — compact UI, a private copy of the leader page
       (docs/ui-redesign-tech-leader.md). Keep in sync with leader.html by
       hand. Differences: no drag reorder, no verse mode, no broadcast —
       the list lives in the PHP session and nothing leaves this device.
       Shared tokens / chrome components: /css/compact.css (.cx-*).
       Invariant: the sheet-music thumbnail is always the LAST (rightmost)
       element of a song row — in the list and in the search results.
       ============================================================ */

    body {
        background: #EDF1F4;
        min-height: 100vh;
    }

    .ld-shell { max-width: 1400px; margin: 0 auto; }

    /* ---- Header ---------------------------------------------- */
    .ld-back .ld-back-ico { display: none; }
    .ld-titles { min-width: 0; flex: 1 1 0; display: flex; flex-direction: column; justify-content: center; }
    .ld-titles .cx-bar-meta { margin-top: 1px; }
    .ld-bar .cx-btn { height: 44px; }

    /* ---- Tools: collections, "all songs", search --------------- */
    .ld-tools { padding: 8px 12px 0; }
    .ld-collections { display: flex; align-items: center; gap: 8px; }
    .ld-chips { flex: 1 1 0; }
    .ld-chips .cx-btn, .ld-all { height: 44px; padding: 0 14px; font-size: 14px; }
    .ld-search {
        position: sticky;
        top: 50px;
        z-index: 90;
        margin: 0 -12px;
        padding: 8px 12px;
        background: #EDF1F4;
    }

    /* Bootstrap-era classes still referenced by the modals below */
    .btn-action-blue {
        padding: 9px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        background: #176B87;
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn-action-blue:hover { background: #125a72; }

    /* ---- Search input / angucomplete override ----------------- */
    #ccf6 .angucomplete-holder { width: 100%; }
    #ccf6 .angucomplete-holder input {
        width: 100%;
        height: 44px;
        padding: 0 14px !important;
        border: 1px solid #DCE3E8 !important;
        border-radius: 6px !important;
        font-size: 15px;
        color: #17212B;
        background: #fff !important;
        box-shadow: none !important;
        -webkit-appearance: none;
    }
    #ccf6 .angucomplete-holder input:focus {
        border-color: #176B87 !important;
        box-shadow: 0 0 0 3px rgba(23,107,135,0.14) !important;
        outline: none;
    }
    .angucomplete-dropdown {
        border: 1px solid #DCE3E8;
        border-radius: 6px;
        box-shadow: 0 6px 20px rgba(23,33,43,0.16);
        overflow: hidden;
        margin-top: 4px;
        padding: 0;
        width: 100%;
        max-height: 60vh;
        overflow-y: auto;
    }
    .angucomplete-row {
        font-size: 14px !important;
        color: #17212B;
        border-bottom: 1px solid #DCE3E8;
    }
    .angucomplete-row:hover,
    .angucomplete-selected-row {
        background: #E6F1F4 !important;
        color: #176B87 !important;
    }

    /* ---- Selected songs ---------------------------------------- */
    .ld-list { padding: 0 12px 32px; }
    .ld-list-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        font-size: 13px;
        font-weight: 600;
        color: #6E7883;
    }
    .ld-h-large { display: none; }
    .ld-count {
        background: #E6F1F4;
        color: #176B87;
        border-radius: 10px;
        padding: 1px 8px;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }
    .btn-clear { height: 36px; }
    .ld-empty { text-align: center; padding: 32px 16px; color: #6E7883; font-size: 13px; }
    .ld-empty-ico { font-size: 30px; margin-bottom: 8px; }
    .ld-hint { padding: 10px 4px 0; font-size: 12px; color: #6E7883; }

    /* One continuous surface with thin separators, not detached cards */
    .favorites-list {
        background: #fff;
        border: 1px solid #DCE3E8;
        border-radius: 6px;
        overflow: hidden;
    }
    .favorites-list:empty { display: none; }

    /* Swipe-to-delete (swipe_delete.js): the row wrapper holds the two red
       action buttons, the sliding surface (.prod-list-item) covers them. */
    .swipe-row { position: relative; border-bottom: 1px solid #DCE3E8; background: #fff; }
    .swipe-row:last-child { border-bottom: none; }
    .swipe-action {
        position: absolute;
        top: 0; bottom: 0;
        width: 104px;
        border: none;
        background: #C4473A;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        visibility: hidden;
        transition: visibility 0s linear 0.18s;   /* stay painted while the surface slides back */
    }
    .swipe-action-l { left: 0; }
    .swipe-action-r { right: 0; }
    .swipe-row.swipe-right .swipe-action-l,
    .swipe-row.swipe-left .swipe-action-r { visibility: visible; transition-delay: 0s; }
    .swipe-action:active { background: #a93a2f; }

    .prod-list-item {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 84px;
        padding: 8px 8px 8px 12px;   /* no drag handle on this page */
        background: #fff;
        touch-action: pan-y;            /* horizontal movement belongs to swipe_delete.js */
        user-select: none;
        -webkit-user-select: none;
    }
    .swipe-row.swiping .prod-list-item,
    .swipe-row.swipe-open .prod-list-item { box-shadow: 0 0 12px rgba(23,33,43,0.22); }

    .ld-info { flex: 1 1 0; min-width: 0; }
    .item-text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        font-size: 15px;
        font-weight: 600;
        color: #17212B;
        line-height: 1.25;
    }
    .song-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
    .song-book-name { font-size: 12px; color: #6E7883; }
    .song-lang-badges { display: inline-flex; gap: 4px; }
    .lang-badge {
        display: inline-block;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 4px;
        line-height: 1.4;
        letter-spacing: 0.3px;
    }
    .lang-ru { background: #d0e8ff; color: #1a5a99; }
    .lang-lt { background: #d4f0d4; color: #2a6a2a; }
    .lang-en { background: #fff0cc; color: #7a5a00; }

    /* Verse mode (¶) and full text (Аа) */
    .song-text-btn {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border-radius: 6px;
        border: 1px solid #DCE3E8;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        color: #176B87;
        background: #fff;
        user-select: none;
    }
    .song-text-btn:hover { border-color: #176B87; background: #E6F1F4; }

    /* Notes thumbnail — always the rightmost element of the row */
    .song-thumb-wrap {
        width: 56px;
        height: 64px;
        flex-shrink: 0;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid #b9c4cd;
        cursor: pointer;
        background: #EDF1F4;
    }
    .song-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
    }

    /* ---- Phone (<= 540px) -------------------------------------- */
    @media (max-width: 540px) {
        .cx-bar.ld-bar { padding: 0 8px; gap: 6px; }
        .ld-back .ld-back-ico { display: inline; font-size: 18px; }
        .ld-back .ld-back-txt { display: none; }
        .ld-back { width: 44px; padding: 0; }
        .ld-titles .cx-bar-meta { display: none; }
        .ld-bar .cx-btn { padding: 0 10px; font-size: 12px; }
        .ld-tools { padding: 8px 8px 0; }
        .ld-search { margin: 0 -8px; padding: 8px; }
        .ld-list { padding: 0 8px 32px; }
    }

    /* ---- Medium tablet, 9-11" portrait (541-899px) ------------- */
    @media (min-width: 541px) {
        .prod-list-item { min-height: 76px; gap: 10px; padding-right: 10px; }
        .item-text { font-size: 16px; }
        .song-thumb-wrap { width: 60px; height: 64px; }
    }

    /* ---- Large tablet, 14" portrait / desktop (>= 900px) -------- */
    @media (min-width: 900px) {
        .ld-shell { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
        .ld-body {
            flex: 1 1 0;
            min-height: 0;
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
        }
        .ld-tools {
            padding: 12px;
            overflow-y: auto;
            border-right: 1px solid #DCE3E8;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .ld-search { position: static; margin: 0; padding: 0; }
        .ld-collections { flex-direction: column; align-items: stretch; }
        .ld-chips { flex: none; flex-direction: column; align-items: stretch; overflow: visible; }
        .ld-chips .cx-btn { justify-content: flex-start; white-space: normal; text-align: left; height: auto; min-height: 44px; padding: 6px 14px; }
        .ld-list { overflow-y: auto; padding: 0 16px 24px; }
        .ld-list-head { position: sticky; top: 0; z-index: 5; background: #EDF1F4; min-height: 52px; }
        .ld-h-default { display: none; }
        .ld-h-large { display: inline; }
        .prod-list-item { min-height: 78px; gap: 12px; padding-right: 12px; }
        .song-thumb-wrap { width: 64px; height: 64px; }
    }

    /* Black full-text screen (lyrics), this device only */
    .piano-text-fs {
        position: fixed;
        top: 0; left: 0;
        /* Use stable vh units (like the main screen) instead of right/bottom:0,
           so the height doesn't jump when the mobile address bar shows/hides. */
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-sizing: border-box;
        overflow: hidden;
    }
    /* Verse blocks, centered and sized (by JS) to fill the screen — same fill
       principle as the main display (#text in text_layout.html). */
    /* Plain block (NOT flex) so verse lines wrap to the width. The JS sets an
       explicit px width; the outer flex container centers this block. */
    .piano-text-fs-inner {
        width: 92vw;
        max-height: 92vh;
        color: #fff;
        font-family: Arial, sans-serif;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        overflow: hidden;
    }
    .piano-text-para {
        margin: 0;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
    /* Gap between verses (each source line). */
    .piano-text-para + .piano-text-para {
        margin-top: 0.6em;
    }

    /* ---- Notes view: the chosen image group's picture, own screen only --- */
    .piano-notes-fs {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 100000;
        cursor: pointer;
        overflow: hidden;
    }
    .piano-notes-img {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        margin: auto;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: #000;
    }
    /* Image-type buttons: same look as the musician page (top, centred, 50%) */
    .mg-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 12px;
        pointer-events: none;
        z-index: 5;
    }
    .mg-btn {
        pointer-events: auto;
        opacity: 0.5;
        min-height: 56px;
        padding: 0 28px;
        border: none;
        border-radius: 12px;
        background: #2c3e50;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
    }
    .mg-btn:focus { outline: none; }
    .mg-btn.mg-sel { background: #1a6db5; }
    .mg-btn.mg-shown { box-shadow: inset 0 0 0 2px #fff; }
    .mg-btn.mg-empty { color: rgba(255,255,255,0.55); }


    /* ---- Modal overrides ------------------------------------- */
    .modal-dialog {
        border-radius: 14px;
    }

    .modal-content {
        border: none;
        border-radius: 14px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.16);
        overflow: hidden;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
    }

    .modal-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
    }

    .modal-song-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f0f2f5;
    }

    .modal-song-row:last-child {
        border-bottom: none;
    }

    .modal-song-name {
        flex: 1;
        font-size: 15px;
        color: #2c3e50;
        font-weight: 500;
    }

    /* ---- Notes mode: full-width modal ------------------------ */
    #list-popup .modal-dialog {
        width:     100%;
        max-width: 1100px;
        margin:    10px auto;
    }
    @media (max-width: 1100px) {
        #list-popup .modal-dialog {
            width: 96vw;
            max-width: 96vw;
        }
    }
    /* Bootstrap's clearfix pseudo-elements (::before/::after on
       .modal-header/.modal-footer) become flex items inside the flex headers
       below and push the title / close button away from the edges. */
    #list-popup .modal-header::before, #list-popup .modal-header::after,
    #confirmation-dialog .modal-header::before, #confirmation-dialog .modal-header::after,
    #confirmation-dialog .modal-footer::before, #confirmation-dialog .modal-footer::after { display: none; }

    #list-popup .modal-content {
        max-height: 96vh;
        border-radius: 10px;
    }
    #list-popup .modal-body {
        padding: 15px;
    }

    /* Toggle button in modal header */
    .notes-toggle-btn {
        display:       inline-flex;
        align-items:   center;
        gap:           5px;
        border:        2px solid #cdd4dd;
        background:    #f4f5f7;
        color:         #5a6272;
        border-radius: 8px;
        padding:       5px 12px;
        font-size:     13px;
        font-weight:   600;
        cursor:        pointer;
        transition:    background 0.15s, border-color 0.15s, color 0.15s;
        white-space:   nowrap;
    }
    .notes-toggle-btn.notes-toggle-active {
        background:    #e8f4fd;
        border-color:  #2980b9;
        color:         #1a6fa8;
    }

    /* ---- Notes mode: song card ------------------------------- */
    .notes-song-card {
        position:      relative;
        margin-bottom: 10px;
        border-radius: 8px;
        border:        1px solid #dde3ea;
        overflow:      hidden;
        background:    #fff;
    }
    .notes-song-card:last-child { margin-bottom: 0; }

    .notes-song-title {
        padding:     8px 12px;
        font-size:   15pt;
        font-weight: 600;
        color:       #2c3e50;
        background:  #f8f9fa;
        display:     flex;
        align-items: center;
        gap:         8px;
        flex-wrap:   wrap;
    }

    .notes-song-img {
        width:   100%;
        display: block;
    }

    /* Invisible overlay button covering title + image */
    .notes-select-overlay {
        position:   absolute;
        inset:      0;
        width:      100%;
        height:     100%;
        background: transparent;
        border:     none;
        cursor:     pointer;
        padding:    0;
        margin:     0;
        z-index:    2;
    }
    .notes-select-overlay:hover  { background: rgba(41,128,185, 0.10); }
    .notes-select-overlay:active { background: rgba(41,128,185, 0.22); }

    /* Small "Select" pill visible in the corner on hover via sibling trick */
    .notes-card-hint {
        position:      absolute;
        top:           8px;
        right:         10px;
        z-index:       3;
        background:    rgba(41,128,185, 0.85);
        color:         #fff;
        font-size:     12px;
        font-weight:   600;
        border-radius: 6px;
        padding:       3px 10px;
        pointer-events:none;
        opacity:       0;
        transition:    opacity 0.15s;
    }
    .notes-song-card:hover .notes-card-hint { opacity: 1; }


    .btn-select {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        border: none;
        background: #ebf3fb;
        color: #1a6db5;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
    }

    .btn-select:hover {
        background: #d6e9f8;
        transform: translateY(-1px);
    }

    /* ---- Number input fix ------------------------------------ */
    input[type=number]::-webkit-inner-spin-button {
        -webkit-appearance: none;
    }
    input[type=number] {
        -moz-appearance: textfield;
        appearance: textfield;
        margin: 0;
    }

    /* ---- Search result row with thumbnail --------------------- */
    .angucomplete-song-row {
        display: flex !important;
        align-items: center !important;
        padding: 7px 12px !important;
        gap: 10px;
    }
    .angucomplete-song-img-col {
        width: 46px; height: 46px; flex-shrink: 0;
        border-radius: 5px; overflow: hidden;
        background: #e8edf2;
        cursor: pointer;
        position: relative;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid #dee3ea;
        transition: opacity 0.15s;
    }
    .angucomplete-song-img-col:hover { opacity: 0.75; }
    .angucomplete-song-img-col::after {
        content: '🎵';
        position: absolute; font-size: 17px; opacity: 0.3;
    }
    .angucomplete-song-thumb-sm {
        width: 46px; height: 46px; object-fit: cover;
        display: block; position: relative; z-index: 1;
    }
    .angucomplete-song-text-col { flex: 1; min-width: 0; }
    .angucomplete-row-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .angucomplete-book-name { font-size: 10px; color: #95a5a6; }

    /* ---- Song preview modal ----------------------------------- */
    .song-preview-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.75);
        z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        padding: 10px;
    }
    .song-preview-modal {
        background: #fff;
        border-radius: 10px;
        width: 100%; height: 100%;
        max-width: 98vw; max-height: 96vh;
        display: flex; flex-direction: column;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .song-preview-header {
        padding: 10px 16px 6px; flex-shrink: 0;
        border-bottom: 1px solid #f0f2f5;
    }
    .song-preview-title { font-size: 15px; font-weight: 700; color: #1a2533; }
    .song-preview-book {
        display: inline-block; font-size: 11px; color: #6b7c93;
        background: #f0f4f8; border-radius: 10px;
        padding: 2px 8px; margin-left: 8px; vertical-align: middle;
    }
    .song-preview-img-wrap {
        flex: 1; min-height: 0;
        display: flex; align-items: center; justify-content: center;
        background: #111; overflow: hidden;
        position: relative;   /* the image-type buttons (.mg-bar) overlay the top */
    }

    /* Image-type chips above the inline notes in the full song list */
    .inline-types { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .inline-type-btn {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1.5px solid #dee2e6;
        background: #f8f9fa;
        color: #5a6272;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .inline-type-btn.inline-type-sel { background: #ebf3fb; border-color: #1a6db5; color: #1a6db5; }
    .inline-type-btn.inline-type-shown { box-shadow: inset 0 0 0 2px #1a6db5; }
    .inline-type-btn.inline-type-empty { color: #b0b8c1; }
    .song-preview-img {
        max-width: 100%; max-height: 100%;
        object-fit: contain; display: block;
    }
    .song-preview-no-img {
        color: #888; font-size: 14px;
    }
    .song-preview-actions {
        display: flex; gap: 10px;
        padding: 10px 16px 12px; flex-shrink: 0;
        border-top: 1px solid #f0f2f5;
    }
</style>

<div ng-controller="Piano" class="cx-page">
    <div class="ld-shell">

        <!-- Application bar: Back + title -->
        <header class="cx-bar ld-bar">
            <button class="cx-btn ld-back" onclick="window.location.href='/index'"
                    aria-label="<?php echo T::s('common.button.back'); ?>">
                <span class="ld-back-ico" aria-hidden="true">←</span>
                <span class="ld-back-txt"><?php echo T::s('common.button.back'); ?></span>
            </button>
            <div class="ld-titles">
                <div class="cx-bar-title"><?php echo T::s('piano.title'); ?></div>
                <div class="cx-bar-meta"><?php echo T::s('piano.subtitle'); ?></div>
            </div>
        </header>

        <div class="ld-body">

        <!-- Tools: collections + "all songs" + search. One column on phones
             and 9-11" tablets, the left utility rail on large screens. -->
        <section class="ld-tools" aria-label="<?php echo T::s('leader.section.books'); ?>">
            <div class="ld-collections">
                <div class="cx-scroll-x ld-chips">
                    <button class="cx-btn btn-list songlist-btn"
                            ng-repeat="list in visibleSongLists"
                            ng-class="listId == list.LIST_ID ? 'btn-selected' : ''"
                            ng-click="setList(list.LIST_ID)">
                        {{ list.LIST_NAME }}
                    </button>
                </div>
                <button class="cx-btn cx-btn-primary ld-all" ng-click="openList()"
                        title="<?php echo T::s('leader.button.showAll'); ?>{{ currentListName() ? ': ' + currentListName() : '' }}">
                    <?php echo T::s('leader.button.allSongs'); ?>
                </button>
            </div>

            <div class="ld-search">
        <script type="text/ng-template" id="song-row-tmpl.html">
            <div class="angucomplete-holder" ng-class="{'angucomplete-dropdown-visible': showDropdown}">
                <input id="{{id}}_value" name="{{inputName}}" tabindex="{{fieldTabindex}}"
                       ng-class="{'angucomplete-input-not-empty': notEmpty}"
                       ng-model="searchStr" ng-disabled="disableInput" type="{{inputType}}"
                       placeholder="{{placeholder}}" maxlength="{{maxlength}}"
                       ng-focus="onFocusHandler()" class="{{inputClass}}"
                       ng-focus="resetHideResults()" ng-blur="hideResults($event)"
                       autocapitalize="off" autocorrect="off" autocomplete="off"
                       ng-change="inputChangeHandler(searchStr)"/>
                <div id="{{id}}_dropdown" class="angucomplete-dropdown" ng-show="showDropdown">
                    <div class="angucomplete-searching" ng-show="searching" ng-bind="textSearching"></div>
                    <div class="angucomplete-searching" ng-show="!searching && (!results || results.length == 0)" ng-bind="textNoResults"></div>
                    <div class="angucomplete-row angucomplete-song-row"
                         ng-repeat="result in results"
                         ng-click="selectResult(result)"
                         ng-mouseenter="hoverRow($index)"
                         ng-class="{'angucomplete-selected-row': $index == currentIndex}">
                        <div class="angucomplete-song-text-col">
                            <div class="angucomplete-title" ng-if="matchClass" ng-bind-html="result.title"></div>
                            <div class="angucomplete-title" ng-if="!matchClass">{{ result.title }}</div>
                            <div class="angucomplete-row-meta">
                                <span ng-if="result.originalObject.bookName" class="angucomplete-book-name">{{ result.originalObject.bookName }}</span>
                                <span class="song-lang-badges">
                                    <span class="lang-badge lang-{{lang.code}}"
                                          ng-repeat="lang in $parent.$parent.langList"
                                          ng-if="result.originalObject['hasText_' + lang.code] == '1'">{{lang.label}}</span>
                                </span>
                            </div>
                        </div>
                        <!-- Sheet-music thumbnail: always the rightmost element -->
                        <div class="angucomplete-song-img-col"
                             ng-click="$emit('song:previewSong', result.originalObject); $event.stopPropagation()"
                             title="<?php echo T::s('leader.search.viewNotes'); ?>">
                            <img ng-src="{{result.image}}" class="angucomplete-song-thumb-sm"
                                 onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
            </div>
        </script>
