        /* ============================================================
           SERMON DISPLAY LAYOUT (docs/ui-redesign-sermon-display.md)
           Landscape-only operating surface that always fills the viewport.
           Tablet: notes (toolbar on top) | preview — 55/45 at every tablet width.
           Phone landscape (height <= 540px): notes 62% | dock 50px | preview.
           The sermon title IS the sermon selector (invisible native <select> on top).
           The notes colours still come from --sn-* (overridable in Settings).
           This block comes last on purpose.
           ============================================================ */
        :root {
            --sd-notes: 55%;          /* notes share on tablets (preview = 45%, Pavel 2026-09-21); the divider is inside it */
            --sd-dock: 50px;
            --sd-toolbar: #18222C;
            --sd-raised: #24313D;
            --sd-text: #E0E6EC;
            --sd-text-dim: #8E9BA8;
            --sd-divider: #3A4652;
            --sn-notes-bg: #202A35;
            --sn-notes-header: #18222C;
            --sn-notes-border: #3A4652;
        }

        html, body { width: 100vw; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; }
        body { background: #000; font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif; }
        #sermon-layout {
            display: grid;
            grid-template-columns: var(--sd-notes) minmax(0, 1fr);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        #notes-panel { width: auto; height: 100%; min-width: 0; overflow: hidden; border-right: 2px solid var(--sd-divider); position: relative; }
        #notes-body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding-left: clamp(20px, 2.2vw, 28px); padding-right: clamp(20px, 2.2vw, 28px); }
        /* Notes never scroll sideways: long words wrap (also at 300% font),
           media and tables from the editor shrink to the pane */
        #notes-body { overflow-x: hidden; overflow-wrap: anywhere; }
        #notes-body img, #notes-body video, #notes-body iframe, #notes-body table, #notes-body svg { max-width: 100%; }
        #notes-body img { height: auto; }
        #notes-body pre { white-space: pre-wrap; }
        #notes-body .bible-cite .cite-ref { white-space: normal; }   /* a long reference wraps instead of overflowing */
        #display-panel { width: auto; height: 100%; min-width: 0; }
        #sermon-dock { display: none; }

        /* ---- Tablet toolbar (notes pane only) ---- */
        #notes-header { height: 50px; padding: 0 10px; gap: 8px; background: var(--sn-notes-header); border-bottom: 1px solid var(--sd-divider); }
        #notes-title-wrap { flex: 1 1 0; min-width: 0; }
        #notes-title { color: var(--sd-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #notes-date { color: var(--sd-text-dim); }
        .btn-back, .font-size-btn {
            height: 44px;
            border: 1px solid var(--sd-divider);
            border-radius: 6px;
            background: var(--sd-raised);
            color: var(--sd-text);
            font-size: 14px;
            flex-shrink: 0;
        }
        .btn-back { padding: 0 12px; white-space: nowrap; }
        #font-size-controls { display: flex; gap: 4px; flex-shrink: 0; }
        .font-size-btn { width: 46px; padding: 0; font-weight: 600; }
        .btn-back:hover, .font-size-btn:hover, #fullscreen-btn:hover, .dock-btn:hover { background: #2e3d4b; color: #fff; }
        /* Title = sermon selector: the native <select> lies invisibly over the
           title/date, so a tap opens the platform's own picker everywhere. */
        #notes-title-wrap {
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            height: 44px;
            padding: 0 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }
        #notes-title-text { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; }
        #notes-title-caret { flex-shrink: 0; color: var(--sd-text-dim); font-size: 13px; line-height: 1; }
        @media (hover: hover) {
            #notes-title-wrap:hover { background: var(--sd-raised); border-color: var(--sd-divider); }
            #notes-title-wrap:hover #notes-title-caret { color: var(--sd-text); }
        }
        #sermon-select {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            opacity: 0;
            cursor: pointer;
            font-size: 16px;   /* smaller makes iOS zoom the page on focus */
        }
        #sermon-layout button:focus-visible,
        #notes-title-wrap:has(#sermon-select:focus-visible) { outline: 2px solid #2F9ED3; outline-offset: 1px; }

        /* Fullscreen: quiet overlay, lower-right corner of the preview */
        #fullscreen-btn {
            position: absolute;
            top: auto; right: 10px; bottom: 10px;
            width: 44px; height: 44px;
            padding: 0;
            border: 1px solid var(--sd-divider);
            border-radius: 6px;
            background: rgba(24,34,44,0.55);
            color: var(--sd-text-dim);
            font-size: 20px;
            z-index: 30;
            opacity: 0.55;
        }
        #fullscreen-btn:hover, #fullscreen-btn:focus-visible { opacity: 1; }

        /* Video controls stay attached to the bottom of the notes pane */
        #sermon-video-controls { flex-shrink: 0; background: var(--sd-toolbar); border-top: 1px solid var(--sd-divider); }

        /* ---- Phone landscape: notes | dock | preview ---- */
        @media (max-height: 540px) {
            #sermon-layout { grid-template-columns: 62% var(--sd-dock) minmax(0, 1fr); }
            #notes-panel { border-right: none; }
            .sd-tablet, #fullscreen-btn { display: none !important; }
            #notes-header { height: 34px; padding: 0 6px; }
            #notes-title-wrap { height: 30px; padding: 0 8px; }
            #notes-title-text { flex-direction: row; align-items: baseline; gap: 8px; }
            #notes-title { flex: 0 1 auto; min-width: 0; }
            #notes-title { font-size: 13px; }
            #notes-date { font-size: 11px; white-space: nowrap; }
            #notes-body { padding-left: 14px; padding-right: 14px; }

            #sermon-dock {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                padding: 3px 0;
                background: var(--sd-toolbar);
                border-left: 1px solid var(--sd-divider);
                border-right: 1px solid var(--sd-divider);
                min-height: 0;
            }
            .dock-btn {
                width: 44px; height: 44px;
                padding: 0;
                border: 1px solid transparent;
                border-radius: 6px;
                background: var(--sd-raised);
                color: var(--sd-text);
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                flex-shrink: 0;
            }
            .dock-clear { margin-top: 10px; color: #f0a59d; border-color: rgba(196,71,58,0.55); }   /* apart from A− / A+ */
            .dock-space { flex: 1 1 0; }
            /* Fullscreen: bottom of the dock, separated by space and a divider */
            .dock-fs { position: relative; margin-top: 7px; font-size: 19px; }
            .dock-fs::before { content: ''; position: absolute; left: -3px; right: -3px; top: -5px; height: 1px; background: var(--sd-divider); }

            #svc-seek { min-height: 28px; }
        }

        /* ---- Portrait on a touch device: rotate request ---- */
        #sd-rotate { display: none; }
        @media (orientation: portrait) and (pointer: coarse) {
            #sermon-layout { display: none; }
            #sd-rotate {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                position: fixed;
                inset: 0;
                padding: 24px;
                background: #18222C;
                color: #E0E6EC;
                font-size: 18px;
                text-align: center;
            }
            #sd-rotate span { font-size: 56px; line-height: 1; color: #8E9BA8; }
        }
        @media (prefers-reduced-motion: reduce) { #notes-body { scroll-behavior: auto !important; } }
    </style>
</head>
<body ng-controller="Sermon">

<div id="sermon-layout">

    <!-- LEFT: Notes panel -->
    <div id="notes-panel">
        <!-- Notes-pane toolbar (tablet): Back · title/date (= sermon selector) · A− A+.
             On a phone in landscape only the title/date strip stays here — the
             other actions live in the central dock (#sermon-dock). -->
        <div id="notes-header">
            <button class="btn-back sd-tablet" ng-click="goHome()"><?php echo T::s('common.button.back'); ?></button>
            <!-- The one sermon selector: a tap on the title («Выберите проповедь»
                 or the sermon's name) opens the native <select> lying over it -->
            <div id="notes-title-wrap" title="<?php echo T::s('sermon.selectSermon'); ?>">
                <div id="notes-title-text">
                    <div id="notes-title">{{ currentSermon ? currentSermon.TITLE || ('<?php echo T::s('sermon.untitled'); ?>') : ('<?php echo T::s('sermon.selectSermon'); ?>') }}</div>
                    <div id="notes-date">{{ currentSermon ? currentSermon.SERMON_DATE : '' }}</div>
                </div>
                <span id="notes-title-caret" aria-hidden="true">▾</span>
                <select id="sermon-select" ng-model="selectedSermonId" ng-change="loadSermon(selectedSermonId)"
                        aria-label="<?php echo T::s('sermon.label.sermon'); ?>">
                    <option value=""><?php echo T::s('common.choose'); ?></option>
                    <option ng-repeat="s in sermonList" value="{{ s.ID }}">
                        {{ s.TITLE || ('<?php echo T::s('sermon.untitled'); ?>') }} {{ s.SERMON_DATE ? '(' + s.SERMON_DATE + ')' : '' }}
                    </option>
                </select>
            </div>
            <div id="font-size-controls" class="sd-tablet">
                <button class="font-size-btn" ng-click="changeNotesFontSize(-1)"
                        title="<?php echo T::s('common.button.decrease'); ?>" aria-label="<?php echo T::s('common.button.decrease'); ?>">A−</button>
                <button class="font-size-btn" ng-click="changeNotesFontSize(+1)"
                        title="<?php echo T::s('common.button.increase'); ?>" aria-label="<?php echo T::s('common.button.increase'); ?>">A+</button>
            </div>
        </div>

        <div id="notes-body" ng-bind-html="notesHtml" ng-if="currentSermon"></div>
        <div class="no-sermon-msg" ng-if="!currentSermon"><?php echo T::s('sermon.empty'); ?></div>

        <!-- Video controls panel (appears when a video is active) -->
        <div id="sermon-video-controls" ng-show="videoActive">

            <!-- Video title + buttons -->
            <div class="svc-row">
                <span class="svc-name" title="{{ videoCurrentName }}">🎬 {{ videoCurrentName }}</span>
                <button class="svc-btn"
                        ng-class="videoPlaying ? 'svc-btn-pause' : 'svc-btn-play'"
                        ng-click="toggleVideoPlayback()">
                    {{ videoPlaying ? ('<?php echo T::s('sermon.video.pause'); ?>') : ('<?php echo T::s('sermon.video.play'); ?>') }}
                </button>
                <button class="svc-btn svc-btn-stop" ng-click="stopVideo()">⏹</button>
            </div>

            <!-- Progress: local files always; YouTube once the player reports
                 its position (yt_bridge) — until then the note below stays.
                 Seeks are mirrored to the display (video_seek). -->
            <div class="svc-progress" ng-if="!videoIsYouTube || videoYtReady">
                <input type="range" id="svc-seek" min="0" max="100" step="0.1"
                       ng-model="videoProgress"
                       ng-mousedown="videoSeeking = true"
                       ng-mouseup="seekVideo(); videoSeeking = false">
                <span class="svc-time">{{ videoCurrentTime }}</span>
            </div>
            <div class="svc-yt" ng-if="videoIsYouTube && !videoYtReady"><?php echo T::s('sermon.video.youtubeNote'); ?></div>

        </div>

    </div>

    <!-- CENTRE (phone landscape only): control dock — a real layout column.
         Fullscreen is pinned to the bottom, apart from the other controls. -->
    <div id="sermon-dock">
        <button class="dock-btn" ng-click="goHome()"
                title="<?php echo T::s('common.button.back'); ?>" aria-label="<?php echo T::s('common.button.back'); ?>">←</button>
        <button class="dock-btn" ng-click="changeNotesFontSize(-1)"
                title="<?php echo T::s('common.button.decrease'); ?>" aria-label="<?php echo T::s('common.button.decrease'); ?>">A−</button>
        <button class="dock-btn" ng-click="changeNotesFontSize(+1)"
                title="<?php echo T::s('common.button.increase'); ?>" aria-label="<?php echo T::s('common.button.increase'); ?>">A+</button>
        <button class="dock-btn dock-clear" ng-click="clearDisplay()"
                title="<?php echo T::s('sermon.clearDisplay'); ?>" aria-label="<?php echo T::s('sermon.clearDisplay'); ?>">⌫</button>
        <span class="dock-space"></span>
        <button class="dock-btn dock-fs" ng-click="toggleFullscreen()"
                title="<?php echo T::s('sermon.fullscreen'); ?>" aria-label="<?php echo T::s('sermon.fullscreen'); ?>">⛶</button>
    </div>

    <!-- RIGHT: Display panel -->
    <div id="display-panel">
        <!-- Browser fullscreen (tablet): quiet overlay in the lower-right corner of the preview -->
        <button id="fullscreen-btn" ng-click="toggleFullscreen()"
                title="<?php echo T::s('sermon.fullscreen'); ?>" aria-label="<?php echo T::s('sermon.fullscreen'); ?>">⛶</button>

        <!--
            Text wrap is ALWAYS present (no ng-hide/ng-show) so that
            clientHeight and clientWidth are always valid for autoFitText().
        -->
        <div id="display-text-wrap">
            <div id="display-text-container">
                <!-- font-size controlled entirely by autoFitText(), NOT ng-style -->
                <div id="display-text">{{ displayText }}</div>
            </div>
            <div id="display-title" ng-show="displayTitle">{{ displayTitle }}</div>
        </div>

        <!-- Image overlay (z-index: 10) covers text when visible -->
        <img id="display-image" ng-show="displayImageSrc" ng-src="{{ displayImageSrc }}" />

        <!-- Slide overlay (z-index: 12) covers everything when a slide is active -->
        <div id="display-slide-wrap" ng-show="displaySlideHtml"
             ng-style="{'background': displaySlideBg}">
            <div id="display-slide-content" ng-bind-html="displaySlideHtml"></div>
        </div>

        <!-- Video overlay (z-index:11, above image overlay z:10) -->
        <div id="display-video-wrap" ng-show="displayVideoSrc">

            <!-- YouTube -->
            <iframe ng-if="displayVideoIsYouTube"
                    id="sermon-yt-player"
                    ng-src="{{ displayVideoEmbedSrc }}"
                    frameborder="0"
                    allow="autoplay; fullscreen"
                    allowfullscreen>
            </iframe>

            <!-- HTML5 video (local file / direct URL) -->
            <video ng-if="!displayVideoIsYouTube"
                   id="sermon-display-video"
                   ng-src="{{ displayVideoSrcLocal }}"
                   autoplay
                   style="object-fit:contain; background:#000;">
            </video>

        </div>

        <!-- Empty state hint -->
        <div id="display-empty" ng-show="!displayText && !displayImageSrc && !displaySlideHtml">
            <?php echo T::s('sermon.display.empty'); ?>
        </div>

        <!-- Zoom badge: current scale while zoomed; tap = reset (both here and on the display) -->
        <div id="dz-badge" ng-show="zoomBadge" ng-click="zoomResetClick()"
             title="<?php echo htmlspecialchars(T::s('sermon.zoom.reset'), ENT_QUOTES); ?>">&times;{{ zoomBadge }} &#10226;</div>

    </div>
</div>

<!-- Portrait on a touch device: ask to rotate instead of stacking the two surfaces -->
<div id="sd-rotate"><span aria-hidden="true">⟳</span><?php echo T::s('sermon.rotate'); ?></div>

<script src="/js/websocket_auth.min.js?v=2"></script>
<script src="/js/net_status.min.js?v=1"></script>
<script src="/js/yt_bridge.min.js?v=1"></script>
<script src="/js/sermon.min.js?v=21" type="text/javascript"></script>
</body>
</html>
