    <script type="text/javascript">
        // [THEME] Light / dark colour scheme, resolved BEFORE the first paint so
        // the page never flashes. The device choice is localStorage ui_theme =
        // 'light' | 'dark' (settings page, this browser only); anything else
        // follows the browser (prefers-color-scheme). The resolved value is
        // html[data-theme], the hook of /css/theme.css. window.uiTheme is the
        // API for the settings page; the 'ui_theme' window event tells the
        // pages that derive colours in JS (sermon prep chips) to recompute.
        (function () {
            var KEY = 'ui_theme';
            var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            function choice() {
                try { var v = localStorage.getItem(KEY); return (v === 'light' || v === 'dark') ? v : 'auto'; }
                catch (e) { return 'auto'; }
            }
            function resolved() {
                var c = choice();
                return c === 'auto' ? ((mq && mq.matches) ? 'dark' : 'light') : c;
            }
            function apply() {
                var t = resolved(), root = document.documentElement;
                if (root.getAttribute('data-theme') === t) return;
                root.setAttribute('data-theme', t);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', t === 'dark' ? '#1A222B' : '#ffffff');
                try { window.dispatchEvent(new CustomEvent('ui_theme', { detail: { theme: t, choice: choice() } })); } catch (e) {}
            }
            window.uiTheme = {
                choice: choice,
                resolved: resolved,
                set: function (c) {
                    try { if (c === 'light' || c === 'dark') localStorage.setItem(KEY, c); else localStorage.removeItem(KEY); } catch (e) {}
                    apply();
                }
            };
            apply();
            if (mq) { if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply); }
        })();
    </script>
