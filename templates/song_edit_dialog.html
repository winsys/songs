<!-- Edit / add song -->
<div id="edit-song-popup">
    <div class="modal fade edit-song-popup" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h3 class="modal-title">✏️ {{ editConfig.title }}</h3>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>

                <div class="modal-body">

                    <!-- Song name and number -->
                    <div class="esp-name-row">
                        <span class="esp-name-label"><?php echo T::s('tech.esp.name'); ?></span>
                        <input type="text"
                               class="esp-name-input"
                               placeholder="<?php echo T::s('tech.esp.namePlaceholder'); ?>"
                               ng-model="editConfig.songName">
                    </div>

                    <div class="esp-name-row" ng-if="editConfig.isNewSong">
                        <span class="esp-name-label"><?php echo T::s('tech.esp.number'); ?></span>
                        <!-- type="text", NOT "number": NUM is a string — a numeric input
                             turns "086" into 86 (leading zero lost, breaking the string
                             ORDER BY in the songbook) and rejects numbers like "д001". -->
                        <input type="text"
                               class="esp-name-input"
                               style="max-width: 120px;"
                               placeholder="№"
                               autocomplete="off"
                               ng-model="editConfig.songNum"
                               ng-blur="checkSongNumUniqueness()">
                        <span class="esp-num-error" ng-if="songNumError">{{ songNumError }}</span>
                    </div>

                    <!-- Text editors (one per language) -->
                    <div class="esp-editors">
                        <div class="esp-editor-col" ng-repeat="lang in langList">
                            <div class="esp-editor-header">
                                <span class="lang-badge lang-{{lang.code}}">{{lang.code | uppercase}}</span>
                                <span class="esp-editor-lang">{{lang.label}}</span>
                                <span class="esp-editor-hint" ng-if="lang.is_default == '1'"><?php echo T::s('tech.esp.verseSeparator'); ?></span>
                                <span class="esp-editor-hint" ng-if="lang.is_default != '1'"><?php echo T::s('tech.esp.optional'); ?></span>
                            </div>
                            <textarea class="verse-editor"
                                      ng-model="editConfig.texts[lang.code]"
                                      placeholder="{{lang.label}}..."></textarea>
                        </div>
                    </div>

                    <!-- Main image of a NEW song (uploaded on Save). Saved songs
                         manage every group, the main one included, in the block below. -->
                    <div class="esp-image-row" ng-if="editConfig.isNewSong">
                        <span class="esp-image-label"><?php echo T::s('tech.esp.image'); ?></span>
                        <img ng-if="editConfig.previewImage"
                             class="esp-image-thumb"
                             ng-src="{{ editConfig.previewImage }}"
                             ng-click="showEnlargedImage(editConfig.previewImage)"
                             title="<?php echo T::s('tech.esp.zoom'); ?>" />
                        <img ng-if="!editConfig.previewImage && editConfig.currentImage"
                             class="esp-image-thumb"
                             ng-src="{{ editConfig.currentImage }}"
                             ng-click="showEnlargedImage(editConfig.currentImage)"
                             title="<?php echo T::s('tech.esp.currentImage'); ?>" />
                        <div class="esp-image-empty" ng-if="!editConfig.previewImage && !editConfig.currentImage">🖼</div>
                        <div class="esp-image-actions">
                            <input type="file"
                                   id="imageUpload"
                                   accept="image/*,application/pdf,.pdf"
                                   style="display:none"
                                   onchange="angular.element(this).scope().previewImage()" />
                            <button class="esp-btn esp-btn-image"
                                    ng-disabled="editConfig.imageBusy"
                                    onclick="document.getElementById('imageUpload').click()">
                                <span ng-if="editConfig.imageBusy"><?php echo T::s('tech.esp.pdfConverting'); ?></span>
                                <span ng-if="!editConfig.imageBusy && !editConfig.previewImage"><?php echo T::s('tech.esp.addImage'); ?></span>
                                <span ng-if="!editConfig.imageBusy && editConfig.previewImage"><?php echo T::s('tech.esp.changeImage'); ?></span>
                            </button>
                            <button class="esp-btn esp-btn-clear-img"
                                    ng-if="editConfig.previewImage"
                                    ng-click="clearImagePreview()">
                                <?php echo T::s('tech.esp.removeImage'); ?>
                            </button>
                            <div class="esp-file-hint"><?php echo T::s('tech.esp.imageFileHint'); ?></div>
                        </div>
                    </div>

                    <!-- Image groups: this song's image in every group of its collection.
                         Uploads / deletions here apply immediately (no Save needed). -->
                    <div class="esp-groups" ng-if="!editConfig.isNewSong">
                        <div class="esp-groups-title"><?php echo T::s('tech.esp.imageGroups'); ?></div>
                        <div class="esp-file-hint"><?php echo T::s('tech.esp.imageFileHint'); ?></div>
                        <div class="esp-group-row" ng-repeat="g in editConfig.imageGroups track by g.id">
                            <div class="esp-group-head">
                                <span class="esp-group-name">{{ g.name }}</span>
                                <span class="esp-group-main" ng-if="g.is_main"><?php echo T::s('import.groups.main'); ?></span>
                            </div>
                            <div class="esp-pages">
                                <div class="esp-page" ng-if="g.image">
                                    <img class="esp-page-thumb"
                                         ng-src="{{ g.image }}{{ editConfig.imgBuster }}"
                                         ng-click="showEnlargedImage(g.image + editConfig.imgBuster)"
                                         title="<?php echo T::s('tech.esp.zoom'); ?>" />
                                    <button type="button" class="esp-page-del"
                                            ng-click="deleteGroupImage(g)"
                                            title="<?php echo T::s('common.button.delete'); ?>">&times;</button>
                                </div>
                                <!-- one image per group: the button adds it or replaces it -->
                                <label class="esp-btn esp-btn-image esp-page-add" ng-class="{'esp-busy': g.uploading || g.converting}">
                                    <span ng-if="!g.uploading && !g.converting && !g.image"><?php echo T::s('tech.esp.addImage'); ?></span>
                                    <span ng-if="!g.uploading && !g.converting && g.image"><?php echo T::s('tech.esp.changeImage'); ?></span>
                                    <span ng-if="g.converting"><?php echo T::s('tech.esp.pdfConverting'); ?></span>
                                    <span ng-if="g.uploading"><?php echo T::s('tech.esp.uploadingPage'); ?></span>
                                    <input type="file" accept="image/jpeg,image/png,application/pdf,.pdf" style="display:none"
                                           ng-attr-data-gid="{{ g.id }}"
                                           onchange="angular.element(this).scope().onGroupFileSelected(this)" />
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="esp-groups-hint" ng-if="editConfig.isNewSong"><?php echo T::s('tech.esp.saveFirstForGroups'); ?></div>

                </div><!-- /modal-body -->

                <div class="modal-footer">
                    <button class="esp-btn esp-btn-cancel" data-dismiss="modal"><?php echo T::s('common.button.cancel'); ?></button>
                    <button class="esp-btn esp-btn-save" ng-click="saveSongEdits()" ng-disabled="editConfig.imageBusy || editConfig.saving">
                        <?php echo T::s('tech.esp.saveChanges'); ?>
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

    <div class="modal fade enlarged-image-popup" role="dialog">
